name: Build My IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. List repository files
        run: |
          echo "=== FILES IN REPO ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: 3. Build Unsigned App
        run: |
          WORKSPACE=$(find . -maxdepth 4 -name "*.xcworkspace" | grep -v "project.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 4 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            TARGET_FLAG="-workspace"
            TARGET_PATH="$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            TARGET_FLAG="-project"
            TARGET_PATH="$PROJECT"
          else
            echo "NO_XCODE_FOUND"
            exit 1
          fi

          SCHEME=$(xcodebuild -list "$TARGET_FLAG" "$TARGET_PATH" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | head -n 1)
          echo "Building $TARGET_PATH with scheme $SCHEME"

          xcodebuild clean build \
            "$TARGET_FLAG" "$TARGET_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 4. Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Spaceagency.ipa Payload

      - name: 5. Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Spaceagency-IPA
          path: Spaceagency.ipa
