name: Build SpaceAgency IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Unzip SpaceAgency source
        run: |
          unzip -o SpaceAgency-source-182.zip -d unzipped_source

      - name: 3. Install XcodeGen & Generate Xcode Project
        run: |
          brew install xcodegen
          cd unzipped_source
          xcodegen generate

      - name: 4. Build Unsigned App
        run: |
          cd unzipped_source
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | head -n 1)
          echo "Building $PROJECT with scheme $SCHEME"

          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 5. Package into .ipa
        run: |
          mkdir -p Payload
          cp -r unzipped_source/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r SpaceAgency.ipa Payload

      - name: 6. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceAgency-IPA
          path: SpaceAgency.ipa
